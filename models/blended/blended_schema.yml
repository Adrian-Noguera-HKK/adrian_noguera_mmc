version: 2

models:
  - name: blended_dim_investment
    columns:
      - name: INVESTMENT
        tests: [not_null]
      - name: INVESTMENT_TYPE
        tests: [not_null]

  - name: blended_dim_ticker
    columns:
      - name: INVESTMENT
        tests: [not_null]
      - name: INVESTMENT_TYPE
        tests: [not_null]
      - name: SYMBOL
        tests: [not_null]

  - name: blended_dim_marketplace
    columns:
      - name: EXCHANGE
        tests: [not_null, unique]
      - name: EXCHANGE_TZ
        tests: []

  - name: blended_dim_date
    columns:
      - name: DATE
        tests: [not_null, unique]
      - name: YEAR
        tests: [not_null]
      - name: MONTHNUMBER
        tests: [not_null]

  - name: blended_fct_investments
    columns:
      - name: INVESTMENT
        tests: [not_null]
      - name: INVESTMENT_TYPE
        tests: [not_null]
      - name: SYMBOL
        tests: [not_null]
      - name: DT
        tests: [not_null]
